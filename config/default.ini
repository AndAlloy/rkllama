; Default Configuration for RKLLAMA
; This file will be automatically generated at startup if it does not exist
; To override these settings, create a file named rkllama.ini in the config directory
; and copy the settings you want to change from this file to that file

[server]
port = 8080
host = 0.0.0.0
debug = false

[paths]
models = ~/.local/share/rkllama/models
logs = ~/.local/share/rkllama/logs
data = ~/.local/share/rkllama/data
src = src
lib = lib
temp = ~/.local/share/rkllama/temp

[model]
default = 

[platform]
processor = rk3588
